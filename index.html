<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sallo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Sallo is a private personal finance app. Your data stays on your device.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#CFD6EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sallo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="storage-banner" class="storage-banner" role="alert" hidden>Your browser isn’t letting Sallo save data (a private window can cause this). Changes will be lost when you close the page.</div>
  <main id="view" tabindex="-1"><p class="boot">Opening Sallo…</p></main>
  <nav id="tabs" aria-label="Main">
    <span class="tab-ind" aria-hidden="true"></span>
    <a href="#/overview" data-tab="overview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Overview</span></a>
    <a href="#/activity" data-tab="activity"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Activity</span></a>
    <a href="#/calendar" data-tab="calendar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
    <a href="#/upcoming" data-tab="upcoming"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2"/></svg><span>Upcoming</span></a>
    <a href="#/savings" data-tab="savings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11c0-3 3-5 7-5s7 2 7 5c0 2-1 3-2 4v3h-3v-2h-4v2H7v-3c-1-1-2-2-2-4zM16 10h.01"/></svg><span>Savings</span></a>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lock-root" hidden></div>
<div id="rotate" aria-hidden="true"><div><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><p>Turn your phone upright</p></div></div>
<div id="shield" aria-hidden="true"><span>Sallo</span></div>
<noscript><p style="padding:24px;font:16px system-ui">Sallo needs JavaScript to run. It doesn’t load anything from the internet.</p></noscript>
<script src="js/sallo.bundle.js" defer></script>
</body>
</html>
